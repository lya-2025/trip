<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip · 旅行</title>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e3a5f;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.66);
      --accent: #38bdf8;
      --focus-ring: rgba(56, 189, 248, 0.5);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
      background-size: 200% 200%;
      animation: drift 20s ease-in-out infinite;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    @keyframes drift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .card {
      width: min(640px, 100%);
      padding: 48px 40px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 64px;
      height: 64px;
      color: var(--accent);
      margin: 0 auto 8px;
      display: block;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h1 .sub {
      display: block;
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.14em;
      margin-top: 8px;
    }

    p.lead {
      margin: 0 0 32px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .feature {
      padding: 16px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .feature:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .feature svg {
      width: 28px;
      height: 28px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .feature h3 {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
    }

    .feature p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    button {
      appearance: none;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.3);
    }
    button:active { transform: translateY(0); }
    button:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      body, .card { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
    </svg>
    <h1>Trip<span class="sub">探索世界，从这里开始</span></h1>
    <p class="lead">一个旅行主题的静态项目，记录每一段精彩的旅程。</p>

    <div class="features">
      <div class="feature">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="m4.93 4.93 4.24 4.24"/>
          <path d="m14.83 9.17 4.24-4.24"/>
          <path d="m14.83 14.83 4.24 4.24"/>
          <path d="m9.17 14.83-4.24 4.24"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        <h3>目的地</h3>
        <p>发现热门景点</p>
      </div>
      <div class="feature">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="4" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <h3>行程规划</h3>
        <p>安排你的旅行</p>
      </div>
      <div class="feature">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
        <h3>旅行记录</h3>
        <p>留住美好回忆</p>
      </div>
    </div>

    <button type="button" onclick="alert('Trip 项目启动！')">开始旅程</button>
  </main>

  <script>
    console.log('Trip project loaded.');
  </script>
</body>
</html>
