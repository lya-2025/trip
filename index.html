<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip · 中国十大旅行景点攻略</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a class="nav-brand" href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      Trip
    </a>
    <button class="nav-toggle" aria-label="菜单">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="nav-links">
      <a href="index.html" class="active">首页</a>
      <div class="nav-dropdown">
        <a href="#" class="nav-dropdown-trigger">景点</a>
        <div class="nav-dropdown-menu"></div>
      </div>
      <a href="旅行攻略网站需求.md">需求文档</a>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero">
    <h1>中国<span>十大</span>旅行景点攻略</h1>
    <p>从长城到丽江，探索中国最壮丽的自然风光与深厚的人文底蕴，每处景点附详细攻略助你轻松出行。</p>
  </header>

  <!-- Search & Filter -->
  <div class="controls">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" id="search" placeholder="搜索景点名称、城市或关键词…" />
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="自然风光">自然风光</button>
      <button class="filter-btn" data-filter="历史人文">历史人文</button>
    </div>
  </div>

  <!-- Card Grid -->
  <main class="grid" id="grid"></main>

  <!-- Footer -->
  <footer class="footer">
    Trip · 中国十大旅行景点攻略 — 纯静态项目，数据仅供参考 · 图片源自 Wikimedia Commons (CC BY-SA)
  </footer>

  <!-- Back to Top -->
  <button class="back-top" id="backTop" aria-label="返回顶部">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script src="js/main.js"></script>
</body>
</html>
